    <script>
      (function () {
        var l = window.location
        var match = l.search.match(/^\?\/(.*)$/)
        if (!match) return
        var raw = match[1]
        var split = raw.indexOf('&')
        var path = split === -1 ? raw : raw.slice(0, split)
        var query = split === -1 ? '' : raw.slice(split + 1).replace(/~and~/g, '&')

        if (query) url += '?' + query
        history.replaceState(null, '', url + l.hash)
      })()
