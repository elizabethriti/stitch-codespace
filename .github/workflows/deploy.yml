name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # Skip the commit this workflow creates, so it cannot loop.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[pages build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install packages
        working-directory: app
        run: npm ci

      - name: Build the app
        working-directory: app
        run: npm run build

      - name: Copy the built site to the Pages location
        run: |
          rm -rf index.html 404.html .nojekyll assets images favicon.svg icons.svg
          cp -a app/dist/. .

      - name: Commit the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[pages build] Update published site"
            git push
          fi
